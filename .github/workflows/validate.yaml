name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v5"
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"

  test:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v5"
      - uses: "actions/setup-python@v6"
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          # Test/dev deps are pinned in requirements_test.txt.
          pip install -r requirements_test.txt
          # Runtime deps come straight from the manifest so CI always tests
          # the version the integration ships.
          jq -r '.requirements[]' custom_components/monarchmoney/manifest.json \
            | xargs -r pip install
      - name: Run tests
        run: pytest tests/ -v
